<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Konzept I · Karten-Explorer — KaM·in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--green:#5aa02c;--blue:#0a93d6;--orange:#ef8f1e;--red:#e2231a;--pink:#c52866;--ink:#1b2430;--dim:#69788a;}
  body{font-family:'Plus Jakarta Sans',sans-serif;height:100vh;overflow:hidden;color:var(--ink);}
  .app{display:grid;grid-template-columns:380px 1fr;height:100vh;}
  /* panel */
  .panel{background:#fff;display:flex;flex-direction:column;box-shadow:8px 0 30px -16px rgba(0,0,0,.3);z-index:5;}
  .ph{padding:20px 22px;border-bottom:1px solid #eef1f4;}
  .ph__brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:1.2rem;}
  .ph__brand img{width:30px;}
  .search{display:flex;align-items:center;gap:10px;background:#f3f5f7;border-radius:12px;padding:12px 15px;margin-top:16px;}
  .search input{border:none;background:none;outline:none;flex:1;font-family:inherit;font-size:.95rem;}
  .filters{display:flex;gap:7px;padding:14px 22px;flex-wrap:wrap;border-bottom:1px solid #eef1f4;}
  .filters button{font-family:inherit;font-weight:600;font-size:.82rem;border:1px solid #e2e7ec;background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;transition:.15s;}
  .filters button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .results{flex:1;overflow-y:auto;padding:10px 14px 20px;}
  .rcard{display:flex;gap:14px;padding:14px;border-radius:14px;cursor:pointer;transition:.14s;border:1px solid transparent;}
  .rcard:hover{background:#f7f9fb;border-color:#e8edf1;}
  .rcard.on{background:#f0f7ff;border-color:#cfe6fb;}
  .rcard__pin{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none;font-weight:800;}
  .rcard h3{font-size:1.08rem;font-weight:700;}
  .rcard .meta{color:var(--dim);font-size:.88rem;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;}
  .rcard .meta b{color:var(--ink);font-weight:700;}
  .rcard .free{display:inline-block;margin-top:7px;font-size:.74rem;font-weight:700;color:var(--green);background:rgba(90,160,44,.12);padding:3px 9px;border-radius:999px;}
  .pf{padding:14px 22px;border-top:1px solid #eef1f4;display:flex;justify-content:space-between;align-items:center;}
  .lang{display:flex;gap:6px;}
  .lang button{font-family:inherit;font-weight:700;font-size:.8rem;border:1px solid #e2e7ec;background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;}
  .lang button.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  /* map */
  .map{position:relative;background:#dde6e0;overflow:hidden;}
  .map__tiles{position:absolute;inset:0;background-image:
    linear-gradient(#c5d3c8 1px,transparent 1px),linear-gradient(90deg,#c5d3c8 1px,transparent 1px);
    background-size:60px 60px;}
  .road{position:absolute;background:#fff;box-shadow:0 0 0 1px #cbd6cd;}
  .road.h{height:26px;left:0;right:0;}.road.v{width:26px;top:0;bottom:0;}
  .river{position:absolute;left:-5%;right:-5%;top:62%;height:70px;background:#bfe0ef;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px #a9d4e8;}
  .block{position:absolute;background:#eef2ee;border:1px solid #d2ddd4;border-radius:4px;}
  .pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:4;transition:.18s;}
  .pin:hover{transform:translate(-50%,-110%) scale(1.08);}
  .pin__dot{width:38px;height:38px;border-radius:50% 50% 50% 4px;rotate:45deg;display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px -5px rgba(0,0,0,.4);border:2.5px solid #fff;}
  .pin__dot span{rotate:-45deg;font-weight:800;font-size:.9rem;}
  .pin.on .pin__dot{animation:bounce .5s;}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(45deg);}40%{transform:translateY(-10px) rotate(45deg);}}
  .pin.main .pin__dot{width:54px;height:54px;background:var(--red);}
  /* popup */
  .popup{position:absolute;z-index:6;background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 20px 50px -16px rgba(0,0,0,.35);width:240px;transform:translate(-50%,-118%);animation:pop .2s ease;}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-110%);}}
  .popup h4{font-size:1.1rem;}.popup p{color:var(--dim);font-size:.88rem;margin-top:4px;}
  .popup .go{display:inline-flex;gap:6px;margin-top:10px;font-weight:700;color:var(--blue);font-size:.9rem;}
  .mapctl{position:absolute;right:18px;top:18px;z-index:5;display:flex;flex-direction:column;gap:8px;}
  .mapctl button{width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid #e2e7ec;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 12px -6px rgba(0,0,0,.3);}
  .back{position:fixed;left:16px;bottom:16px;z-index:50;background:#fff;border:1px solid #e2e7ec;border-radius:999px;padding:9px 15px;font-weight:700;font-size:.85rem;text-decoration:none;color:var(--ink);box-shadow:0 4px 12px -6px rgba(0,0,0,.3);}
  @media(max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:1fr 280px;}.map{grid-row:1;}.panel{grid-row:2;}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="ph">
      <div class="ph__brand"><img src="../assets/kamin-mark.png" alt="" /> KaM·in entdecken</div>
      <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#69788a" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input placeholder="Angebot oder Tag suchen…" /></div>
    </div>
    <div class="filters"><button class="on">Alle</button><button>Heute</button><button>Sprache</button><button>Familie</button><button>Kreativ</button></div>
    <div class="results" id="results"></div>
    <div class="pf"><span style="color:var(--dim);font-size:.85rem">7 Angebote · alle kostenlos</span><div class="lang"><button class="on">DE</button><button>UA</button><button>EN</button></div></div>
  </aside>

  <div class="map" id="map">
    <div class="map__tiles"></div>
    <div class="road h" style="top:30%"></div><div class="road h" style="top:70%"></div>
    <div class="road v" style="left:34%"></div><div class="road v" style="left:68%"></div>
    <div class="river"></div>
    <div class="block" style="left:8%;top:36%;width:20%;height:28%"></div>
    <div class="block" style="left:40%;top:8%;width:22%;height:18%"></div>
    <div class="block" style="left:72%;top:36%;width:18%;height:26%"></div>
    <div class="mapctl"><button>+</button><button>−</button></div>
  </div>
</div>
<a href="../KaM-in Konzepte.html" class="back">← Konzepte</a>
<script>
  const C={green:'#5aa02c',blue:'#0a93d6',orange:'#ef8f1e',red:'#e2231a',pink:'#c52866'};
  const SP=[
    {t:'KaM·in · Bürgertreff',m:'Marktplatz 108 · Treffpunkt',d:'Das Herz: hier finden alle Angebote statt.',c:'red',x:51,y:48,main:true,ab:'★'},
    {t:'Wir sprechen Deutsch',m:'Mo 15:00 · Sprachtreff',d:'Locker üben, alle Niveaus willkommen.',c:'green',x:30,y:30,ab:'D'},
    {t:'Spieletreff',m:'Fr 15:00 · für alle',d:'Karten- und Brettspiele für Jung und Alt.',c:'orange',x:70,y:34,ab:'S'},
    {t:'Nadelspielereien',m:'Do 15:00 · Handarbeit',d:'Nähen, stricken, häkeln — Material ist da.',c:'pink',x:36,y:74,ab:'N'},
    {t:'Feierabendtreff',m:'1×/Monat · Abend',d:'Fröhliches Beisammensein für alle.',c:'blue',x:72,y:72,ab:'F'},
  ];
  const map=document.getElementById('map'),results=document.getElementById('results');
  let popup=null;
  function showPopup(s){
    if(popup)popup.remove();
    popup=document.createElement('div');popup.className='popup';popup.style.left=s.x+'%';popup.style.top=(s.y-6)+'%';
    popup.innerHTML=`<h4>${s.t}</h4><p>${s.d}</p><span class="go">Details ansehen →</span>`;
    map.appendChild(popup);
  }
  SP.forEach((s,i)=>{
    const pin=document.createElement('div');pin.className='pin'+(s.main?' main':'');pin.style.left=s.x+'%';pin.style.top=s.y+'%';
    pin.innerHTML=`<div class="pin__dot" style="background:${C[s.c]}"><span>${s.ab}</span></div>`;
    pin.onclick=()=>{document.querySelectorAll('.pin').forEach(p=>p.classList.remove('on'));pin.classList.add('on');showPopup(s);highlight(i);};
    map.appendChild(pin);
    const card=document.createElement('div');card.className='rcard'+(s.main?' on':'');card.dataset.i=i;
    card.innerHTML=`<div class="rcard__pin" style="background:${C[s.c]}">${s.ab}</div>
      <div><h3>${s.t}</h3><div class="meta"><b>${s.m.split('·')[0]}</b><span>${s.m.split('·')[1]||''}</span></div><span class="free">kostenlos</span></div>`;
    card.onclick=()=>{pin.click();card.scrollIntoView({block:'nearest'});};
    results.appendChild(card);
  });
  function highlight(i){document.querySelectorAll('.rcard').forEach(c=>c.classList.toggle('on',+c.dataset.i===i));}
  showPopup(SP[0]);document.querySelector('.pin.main').classList.add('on');
</script>
</body>
</html>
