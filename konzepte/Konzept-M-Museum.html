<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Konzept M · Museum — KaM·in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{--wall:#e9e5dc;--wall2:#e0dbd0;--ink:#23211c;--dim:#7a756a;--gold:#9c7a3c;--line:#cdc6b8;}
  body{font-family:'Jost',sans-serif;background:var(--wall);color:var(--ink);}
  .serif{font-family:'Cormorant Garamond',serif;}
  /* top museum nav */
  .mnav{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:20px 36px;background:var(--wall);border-bottom:1px solid var(--line);}
  .mnav .brand{display:flex;align-items:center;gap:14px;}
  .mnav .brand img{height:38px;}
  .mnav .brand b{font-family:'Cormorant Garamond';font-weight:600;font-size:1.5rem;letter-spacing:.02em;}
  .mnav .brand small{display:block;font-size:.66rem;letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-top:1px;}
  .mnav nav{display:flex;gap:2px;}
  .mnav nav a{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-decoration:none;padding:10px 16px;transition:.18s;position:relative;}
  .mnav nav a::after{content:'';position:absolute;left:50%;bottom:6px;width:0;height:1px;background:var(--gold);transition:.25s;transform:translateX(-50%);}
  .mnav nav a:hover::after,.mnav nav a.on::after{width:60%;}
  .mnav nav a.on{color:var(--gold);}
  /* hero / exhibition title */
  .ex{text-align:center;padding:90px 24px 60px;}
  .ex .room{font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);}
  .ex h1{font-family:'Cormorant Garamond';font-weight:500;font-size:clamp(3rem,9vw,7rem);line-height:.98;margin:18px 0;}
  .ex h1 em{font-style:italic;color:var(--gold);}
  .ex p{font-family:'Cormorant Garamond';font-size:clamp(1.2rem,2.6vw,1.7rem);font-style:italic;color:var(--dim);max-width:40ch;margin:0 auto;}
  .ex .dates{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);margin-top:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:inline-block;padding:12px 26px;}
  /* gallery wall */
  .wall{max-width:1180px;margin:0 auto;padding:40px 36px 80px;display:grid;grid-template-columns:repeat(3,1fr);gap:54px 40px;}
  .art{cursor:pointer;}
  .frame{background:#fff;padding:18px;border:1px solid var(--line);box-shadow:0 26px 50px -28px rgba(0,0,0,.4);position:relative;transition:.25s;}
  .art:hover .frame{transform:translateY(-6px);box-shadow:0 36px 60px -28px rgba(0,0,0,.5);}
  .frame::before{content:'';position:absolute;inset:8px;border:1px solid var(--line);pointer-events:none;}
  .canvas{aspect-ratio:4/5;display:grid;place-items:center;position:relative;overflow:hidden;}
  .canvas .no{font-family:'Cormorant Garamond';font-style:italic;color:#fff;font-size:1.1rem;opacity:.9;}
  .plcaque{margin-top:18px;border-left:2px solid var(--gold);padding-left:14px;}
  .plcaque .t{font-family:'Cormorant Garamond';font-weight:600;font-size:1.4rem;line-height:1.1;}
  .plaque .y,.plcaque .y{font-style:italic;color:var(--dim);font-size:.95rem;margin-top:3px;}
  .plcaque .d{font-size:.9rem;color:var(--dim);margin-top:8px;line-height:1.5;}
  .plcaque .med{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:8px;}
  /* footer plate */
  .plate{text-align:center;padding:40px 24px 70px;border-top:1px solid var(--line);max-width:1180px;margin:0 auto;}
  .plate .lang{display:inline-flex;gap:8px;margin-top:14px;}
  .plate .lang button{font-family:'Jost';font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--ink);padding:8px 16px;cursor:pointer;transition:.18s;}
  .plate .lang button.on,.plate .lang button:hover{background:var(--ink);color:var(--wall);border-color:var(--ink);}
  .plate p{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);}
  .back{position:fixed;left:18px;bottom:18px;z-index:40;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;background:var(--ink);color:var(--wall);padding:9px 15px;text-decoration:none;}
  @media(max-width:820px){.wall{grid-template-columns:repeat(2,1fr);gap:36px 24px;}.mnav nav{display:none;}}
  @media(max-width:520px){.wall{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header class="mnav">
  <div class="brand"><img src="../assets/kamin-mark.png" alt="" /><div><b>KaM·in</b><small>Museum der Begegnung</small></div></div>
  <nav><a class="on">Ausstellung</a><a>Termine</a><a>Projekte</a><a>KAPi</a><a>Besuch</a></nav>
</header>

<section class="ex">
  <div class="room">Saal I · Dauerausstellung</div>
  <h1 class="serif">Komm <em>herein.</em></h1>
  <p>Eine lebendige Sammlung von Begegnungen — zwischen Generationen, Sprachen und Kulturen.</p>
  <div class="dates">Geöffnet Mo–Sa · Eintritt frei · Marktplatz 108</div>
</section>

<section class="wall" id="wall"></section>

<div class="plate">
  <p>KaM·in · Museum der Begegnung · Kappelrodeck</p>
  <div class="lang"><button class="on">DE</button><button>UA</button><button>EN</button></div>
</div>
<a href="../KaM-in Konzepte.html" class="back">← Konzepte</a>
<script>
  const ART=[
    {t:'Wir sprechen Deutsch',y:'Sprachtreff, montags',d:'Locker üben in der Runde — für alle Niveaus.',g:'linear-gradient(135deg,#6aa12f,#2f5d18)',med:'Gespräch · 90 Min'},
    {t:'Nadelspielereien',y:'Handarbeitstreff, donnerstags',d:'Nähen, stricken, häkeln. Material vorhanden.',g:'linear-gradient(135deg,#c52866,#6e1338)',med:'Textil · 120 Min'},
    {t:'Spieletreff',y:'Karten & Brettspiele, freitags',d:'Für Jung und Alt. Komm einfach mit.',g:'linear-gradient(135deg,#ef8f1e,#8a4d0c)',med:'Spiel · 120 Min'},
    {t:'Offene Musikwerkstatt',y:'nach Vereinbarung',d:'Gemeinsam Musik machen am Wochenende.',g:'linear-gradient(135deg,#f4b400,#9c7203)',med:'Klang · offen'},
    {t:'Feierabendtreff',y:'einmal im Monat',d:'Fröhliches Beisammensein für alle aus aller Welt.',g:'linear-gradient(135deg,#e2231a,#7d0f0a)',med:'Begegnung · Abend'},
    {t:'Afrikanisches Trommeln',y:'Workshop, Termin bald',d:'Für Kinder und Erwachsene gemeinsam.',g:'linear-gradient(135deg,#0a93d6,#064d70)',med:'Rhythmus · Event'},
  ];
  const wall=document.getElementById('wall');
  ART.forEach((a,i)=>{const n='Nr. '+(i+1);const el=document.createElement('article');el.className='art';
    el.innerHTML=`<div class="frame"><div class="canvas" style="background:${a.g}"><span class="no">[ ${n} · Foto ]</span></div></div>
      <div class="plcaque"><div class="t">${a.t}</div><div class="y">${a.y}</div><div class="d">${a.d}</div><div class="med">${a.med} · Eintritt frei</div></div>`;
    wall.appendChild(el);});
</script>
</body>
</html>
