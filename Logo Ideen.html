<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAPi – Logo Ideen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Archivo+Black&family=Caveat:wght@500;700&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Schibsted Grotesk', sans-serif; }

  .lg { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .script { font-family: 'Caveat', cursive; font-weight: 700; }

  /* Brand colors */
  .cg { color: #6aa12f; } .cb { color: #0a93d6; } .co { color: #ef8f1e; }
  .cy { color: #f4b400; } .cr { color: #e2231a; } .cp { color: #c52866; }

  .board { width: 100%; height: 100%; display: grid; place-items: center; background: #fff; }
  .board.dark { background: #11141b; }
  .board.cream { background: #fdf3e2; }

  /* — A: Punkt aus Vielfalt — */
  .iword { position: relative; display: inline-block; }
  .iword .stem { font-style: normal; }
  .iword .dot {
    position: absolute; left: 50%; transform: translateX(-50%);
    border-radius: 50%; display: block;
    background: conic-gradient(#6aa12f, #0a93d6, #c52866, #e2231a, #ef8f1e, #f4b400, #6aa12f);
  }

  /* — C: Wort-Stapel — */
  .stack { display: grid; gap: 2px; }
  .stack .row { display: flex; align-items: baseline; }

  /* — E: i-Mensch — */
  .ifig { display: inline-grid; justify-items: center; gap: 7px; }
  .ifig .head { width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(#6aa12f, #0a93d6, #c52866, #e2231a, #ef8f1e, #f4b400, #6aa12f); }
  .ifig .body { width: 16px; height: 56px; border-radius: 9px; background: #15151a; }
  .board.dark .ifig .body { background: #f2f0ea; }

  /* — F: Bogen — */
  .arc { position: relative; display: inline-block; }
  .arc .d { position: absolute; width: 11px; height: 11px; border-radius: 50%; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="js/design-canvas.jsx"></script>

<script type="text/babel">
const BRAND = ['#6aa12f', '#0a93d6', '#c52866', '#e2231a', '#ef8f1e'];

/* Wiederverwendbar: KAPi mit Vielfalts-Punkt auf dem i */
function KapiDot({ size = 92, ink = '#15151a', iColor = '#e2231a' }) {
  const dotSize = size * 0.17;
  return (
    <span className="lg" style={{ fontSize: size, color: ink }}>
      KAP<span className="iword" style={{ color: iColor }}>
        <span className="stem">ı</span>
        <span className="dot" style={{ width: dotSize, height: dotSize, top: size * 0.018 }}></span>
      </span>
    </span>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="logos" title="Logo-Konzepte" subtitle="6 Richtungen — alle bauen auf den Brand-Farben aus dem bestehenden Ring auf">

        <DCArtboard id="a-punkt" label="A · Vielfalts-Punkt" width={520} height={340}>
          <div className="board">
            <div style={{ display: 'grid', justifyItems: 'center', gap: 14 }}>
              <KapiDot size={110} />
              <div className="script" style={{ fontSize: 30, color: '#15151a' }}>Stark durch Vielfalt</div>
            </div>
          </div>
        </DCArtboard>

        <DCArtboard id="b-ring" label="B · Ring neu geordnet" width={520} height={340}>
          <div className="board">
            <div style={{ display: 'grid', justifyItems: 'center', gap: 10 }}>
              <img src="assets/kamin-mark.png" alt="Ring aus Menschen" style={{ height: 74 }} />
              <div className="lg" style={{ fontSize: 86, color: '#15151a' }}>KAPi</div>
              <div style={{ fontSize: 15, fontWeight: 600, letterSpacing: '.34em', textTransform: 'uppercase', color: '#65656e', marginTop: 2 }}>Kappelrodeck International</div>
            </div>
          </div>
        </DCArtboard>

        <DCArtboard id="c-stapel" label="C · Wortspiel-Stapel" width={520} height={340}>
          <div className="board">
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: 18 }}>
              <div className="lg" style={{ fontSize: 96, color: '#15151a' }}>KAP</div>
              <div className="stack" style={{ paddingTop: 14 }}>
                <div className="row lg" style={{ fontSize: 26 }}><span className="cr">i</span><span style={{ color: '#15151a' }}>nternational</span></div>
                <div className="row lg" style={{ fontSize: 26 }}><span className="cb">i</span><span style={{ color: '#15151a' }}>ntegrativ</span></div>
                <div className="row lg" style={{ fontSize: 26 }}><span className="cg">i</span><span style={{ color: '#15151a' }}>nklusiv</span></div>
                <div className="row lg" style={{ fontSize: 26 }}><span className="co">i</span><span style={{ color: '#15151a' }}>nspirierend</span></div>
              </div>
            </div>
          </div>
        </DCArtboard>

        <DCArtboard id="d-badge" label="D · Plakat-Badge" width={520} height={340}>
          <div className="board cream">
            <div style={{ background: '#16120e', borderRadius: 18, padding: '38px 52px', display: 'grid', justifyItems: 'center', gap: 16, boxShadow: '8px 8px 0 rgba(25,21,18,.9)' }}>
              <div className="lg" style={{ fontSize: 84, color: '#fdf3e2' }}>KAPi</div>
              <div style={{ display: 'flex', gap: 9 }}>
                {BRAND.map((c, i) => <span key={i} style={{ width: 13, height: 13, borderRadius: '50%', background: c }}></span>)}
              </div>
              <div style={{ fontSize: 13, fontWeight: 700, letterSpacing: '.3em', textTransform: 'uppercase', color: '#b3a48d' }}>Stark durch Vielfalt</div>
            </div>
          </div>
        </DCArtboard>

        <DCArtboard id="e-mensch" label="E · Das i ist ein Mensch" width={520} height={340}>
          <div className="board">
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6 }}>
              <div className="lg" style={{ fontSize: 96, color: '#15151a', lineHeight: .82 }}>KAP</div>
              <div className="ifig" style={{ paddingBottom: 2 }}>
                <span className="head"></span>
                <span className="body"></span>
              </div>
              <div className="script" style={{ fontSize: 28, color: '#65656e', marginLeft: 18, paddingBottom: 6 }}>jeder Mensch<br/>zählt</div>
            </div>
          </div>
        </DCArtboard>

        <DCArtboard id="f-bogen" label="F · Offener Bogen" width={520} height={340}>
          <div className="board">
            <div style={{ display: 'grid', justifyItems: 'center', gap: 16 }}>
              <span className="arc lg" style={{ fontSize: 100, color: '#15151a', padding: '26px 8px 0' }}>
                KAPi
                <span className="d" style={{ background: '#6aa12f', left: '4%',  top: 14 }}></span>
                <span className="d" style={{ background: '#0a93d6', left: '27%', top: -2 }}></span>
                <span className="d" style={{ background: '#e2231a', left: '50%', top: -8 }}></span>
                <span className="d" style={{ background: '#ef8f1e', left: '73%', top: -2 }}></span>
                <span className="d" style={{ background: '#f4b400', left: '92%', top: 14 }}></span>
              </span>
              <div style={{ fontSize: 14, fontWeight: 600, letterSpacing: '.3em', textTransform: 'uppercase', color: '#65656e' }}>Kappelrodeck International</div>
            </div>
          </div>
        </DCArtboard>

      </DCSection>

      <DCSection id="dark" title="Auf Dunkel" subtitle="So wirken die Favoriten auf dunklem Grund (z. B. Website-Hero)">
        <DCArtboard id="a-dark" label="A · dunkel" width={520} height={340}>
          <div className="board dark">
            <div style={{ display: 'grid', justifyItems: 'center', gap: 14 }}>
              <KapiDot size={110} ink="#f2f0ea" iColor="#f2f0ea" />
              <div className="script" style={{ fontSize: 30, color: '#9aa0ad' }}>Stark durch Vielfalt</div>
            </div>
          </div>
        </DCArtboard>
        <DCArtboard id="c-dark" label="C · dunkel" width={520} height={340}>
          <div className="board dark">
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: 18 }}>
              <div className="lg" style={{ fontSize: 96, color: '#f2f0ea' }}>KAP</div>
              <div className="stack" style={{ paddingTop: 14 }}>
                <div className="row lg" style={{ fontSize: 26 }}><span className="cr">i</span><span style={{ color: '#f2f0ea' }}>nternational</span></div>
                <div className="row lg" style={{ fontSize: 26 }}><span className="cb">i</span><span style={{ color: '#f2f0ea' }}>ntegrativ</span></div>
                <div className="row lg" style={{ fontSize: 26 }}><span className="cg">i</span><span style={{ color: '#f2f0ea' }}>nklusiv</span></div>
                <div className="row lg" style={{ fontSize: 26 }}><span className="co">i</span><span style={{ color: '#f2f0ea' }}>nspirierend</span></div>
              </div>
            </div>
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
